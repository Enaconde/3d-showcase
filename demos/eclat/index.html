<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maison Éclat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;1,300&family=Inter:wght@400;500&display=swap">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { background: #0d0907; color: #f4ece2; font-family: Inter, system-ui, sans-serif; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
  .grain { position: fixed; inset: 0; pointer-events: none; z-index: 1; opacity: .08;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
  nav { position: fixed; top: 0; left: 0; right: 0; z-index: 5; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 24px 36px; font-size: 12px; letter-spacing: .18em; text-transform: uppercase; mix-blend-mode: difference; }
  nav .c { font: 500 22px "Cormorant Garamond", serif; letter-spacing: .35em; }
  nav .r { text-align: right; }
  .back { position: fixed; bottom: 24px; left: 36px; z-index: 5; font-size: 11px; letter-spacing: .15em; text-transform: uppercase; color: inherit; opacity: .6; text-decoration: none; }
  .back:hover { opacity: 1; }
  .hero { position: relative; z-index: 2; height: 100vh; display: grid; place-items: center; text-align: center; }
  .hero h1 { font: 300 clamp(64px, 15vw, 240px)/.85 "Cormorant Garamond", serif; letter-spacing: -.02em; }
  .hero h1 em { font-style: italic; }
  .line { display: block; overflow: hidden; }
  .line > span { display: inline-block; transform: translateY(110%); }
  .hero p { margin-top: 26px; font-size: 12px; letter-spacing: .4em; text-transform: uppercase; opacity: 0; }
  .marquee { position: relative; z-index: 2; overflow: hidden; border-top: 1px solid rgba(244,236,226,.2); border-bottom: 1px solid rgba(244,236,226,.2); padding: 22px 0; }
  .marquee div { display: inline-block; white-space: nowrap; font: italic 300 56px "Cormorant Garamond", serif; animation: m 30s linear infinite; }
  @keyframes m { to { transform: translateX(-50%); } }
  .looks { position: relative; z-index: 2; display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; padding: 120px 36px; }
  .look { aspect-ratio: 3/4; border-radius: 2px; position: relative; overflow: hidden; transform: translateY(60px); opacity: 0; transition: transform 1.2s cubic-bezier(.2,.7,.2,1), opacity 1.2s; }
  .look.in { transform: none; opacity: 1; }
  .look:nth-child(2) { margin-top: 80px; }
  .look .art { position: absolute; inset: 0; transition: transform 1.2s cubic-bezier(.2,.7,.2,1); }
  .look:hover .art { transform: scale(1.06); }
  .look figcaption { position: absolute; left: 18px; bottom: 16px; font-size: 11px; letter-spacing: .2em; text-transform: uppercase; }
  .look b { display: block; font: 300 34px "Cormorant Garamond", serif; letter-spacing: 0; text-transform: none; }
  .quote { position: relative; z-index: 2; padding: 140px 12vw 180px; text-align: center; font: 300 clamp(32px, 4.5vw, 64px)/1.15 "Cormorant Garamond", serif; }
  .quote em { font-style: italic; color: #e6b98a; }
  @media (max-width: 760px) { nav { grid-template-columns: 1fr auto; } nav .l { display: none; } .looks { grid-template-columns: 1fr; padding: 80px 16px; } .look:nth-child(2) { margin-top: 0; } .marquee div { font-size: 36px; } }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div class="grain"></div>
<nav><div class="l">Collections</div><div class="c">ÉCLAT</div><div class="r">Bag (0)</div></nav>
<a class="back" href="../../#eclat">← Back to showcase</a>

<header class="hero">
  <div>
    <h1><span class="line"><span>Maison</span></span><span class="line"><span><em>Éclat</em></span></span></h1>
    <p id="sub">Autumn · Winter · Paris</p>
  </div>
</header>
<div class="marquee"><div>Silk in motion — Light as gesture — Made in Paris — Silk in motion — Light as gesture — Made in Paris —&nbsp;</div></div>
<section class="looks">
  <figure class="look"><div class="art" style="background:radial-gradient(80% 60% at 30% 30%,#e6b98a,#6b3a22 60%,#1b0f0a)"></div><figcaption>Look 01<b>Ambre</b></figcaption></figure>
  <figure class="look"><div class="art" style="background:radial-gradient(70% 70% at 70% 40%,#c9c2d6,#4b4361 55%,#120f18)"></div><figcaption>Look 02<b>Brume</b></figcaption></figure>
  <figure class="look"><div class="art" style="background:radial-gradient(80% 60% at 40% 70%,#9fb8a3,#2f4a3a 55%,#0c1410)"></div><figcaption>Look 03<b>Sauge</b></figcaption></figure>
</section>
<div class="quote">“Clothes should move the way <em>light</em> moves across silk — never still, never loud.”</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }</script>
<script type="module">
import * as THREE from "three";

// Full-screen "liquid silk" shader: layered noise folds, lit like fabric, pushed by the mouse.
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("gl") });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const uniforms = { uTime: { value: 0 }, uRes: { value: new THREE.Vector2() }, uMouse: { value: new THREE.Vector2(0.5, 0.5) }, uScroll: { value: 0 } };
scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.ShaderMaterial({
  uniforms,
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position, 1.0); }`,
  fragmentShader: /* glsl */`
    precision highp float;
    varying vec2 vUv; uniform float uTime, uScroll; uniform vec2 uRes, uMouse;
    vec3 hash3(vec2 p){ vec3 q = vec3(dot(p,vec2(127.1,311.7)), dot(p,vec2(269.5,183.3)), dot(p,vec2(419.2,371.9))); return fract(sin(q)*43758.5453); }
    float noise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);
      float a=hash3(i).x, b=hash3(i+vec2(1,0)).x, c=hash3(i+vec2(0,1)).x, d=hash3(i+vec2(1,1)).x;
      return mix(mix(a,b,f.x), mix(c,d,f.x), f.y); }
    float fbm(vec2 p){ float v=0.0, a=0.5; for(int i=0;i<4;i++){ v+=a*noise(p); p*=2.02; a*=0.5; } return v; }
    float silk(vec2 p, float t){
      vec2 q = vec2(fbm(p + t*0.05), fbm(p + vec2(5.2,1.3) - t*0.04));
      return fbm(p + 2.2*q + t*0.03);
    }
    void main(){
      vec2 uv = vUv; float asp = uRes.x / uRes.y;
      vec2 p = vec2(uv.x * asp, uv.y) * 1.1;
      vec2 m = vec2(uMouse.x * asp, uMouse.y) * 1.1;
      float md = length(p - m);
      p += (p - m) * 0.08 * exp(-md * md * 3.0);           // mouse pushes the fabric
      p.y += uScroll * 0.8;
      float t = uTime;
      float h = silk(p, t);
      float e = 0.003;
      vec2 g = vec2(silk(p + vec2(e,0), t) - h, silk(p + vec2(0,e), t) - h) / e;
      vec3 n = normalize(vec3(-g * 0.22, 1.0));
      vec3 l = normalize(vec3(-0.4, 0.6, 0.7));
      float diff = clamp(dot(n, l), 0.0, 1.0);
      float spec = pow(clamp(dot(reflect(-l, n), vec3(0,0,1)), 0.0, 1.0), 24.0);
      vec3 deep = vec3(0.05, 0.03, 0.025), mid = vec3(0.42, 0.22, 0.13), hi = vec3(0.98, 0.80, 0.62);
      vec3 col = mix(deep, mid, smoothstep(0.2, 0.9, diff));
      col += hi * spec * 0.9;
      col *= 0.55 + 0.6 * h;
      col *= 1.0 - 0.45 * uScroll;                          // darken as you scroll into content
      float vig = smoothstep(1.2, 0.3, length(uv - 0.5));
      gl_FragColor = vec4(col * vig, 1.0);
    }`,
})));

const mouse = new THREE.Vector2(0.5, 0.5);
addEventListener("pointermove", (e) => mouse.set(e.clientX / innerWidth, 1 - e.clientY / innerHeight));
function resize() { renderer.setSize(innerWidth, innerHeight, false); uniforms.uRes.value.set(innerWidth, innerHeight); }
addEventListener("resize", resize); resize();
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  uniforms.uTime.value = clock.getElapsedTime();
  uniforms.uMouse.value.lerp(mouse, 0.05);
  uniforms.uScroll.value = Math.min(1, scrollY / innerHeight);
  renderer.render(scene, camera);
});

// Intro: title lines slide up, subtitle fades in
if (location.search.includes("capture")) gsap.set(".line > span", { y: 0 }), gsap.set("#sub", { opacity: 0.7 });
else gsap.to(".line > span", { y: 0, duration: 1.4, ease: "expo.out", stagger: 0.15, delay: 0.3 });
gsap.to("#sub", { opacity: 0.7, duration: 1.2, delay: 1.1 });
const io = new IntersectionObserver((es) => es.forEach((e) => e.isIntersecting && e.target.classList.add("in")), { threshold: 0.2 });
document.querySelectorAll(".look").forEach((el, i) => { el.style.transitionDelay = i * 0.12 + "s"; io.observe(el); });
</script>
</body>
</html>
